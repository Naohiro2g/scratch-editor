name: Inspect McRemote release OCI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Acquire exact frozen and rebuilt archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p comparison
          gh api repos/Naohiro2g/scratch-editor/actions/artifacts/11314795242/zip > frozen.zip
          gh api repos/Naohiro2g/scratch-editor/actions/artifacts/11327285872/zip > rebuilt.zip
          printf '%s  %s\n' \
            27ade4f9b3d6a1e4b0cf814ef346b75613df8e8d446c82793b345665be9c4d7c frozen.zip \
            846a09c29f1c19b6fee793c80863ced6950bed0c33b4207c318b8b05eec1ce1b rebuilt.zip \
            | sha256sum --check
      - name: Compare platform layers and config differences
        id: compare
        continue-on-error: true
        run: python3 scripts/compare-scratch-release-oci.py frozen.zip rebuilt.zip comparison/scratch-oci-comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scratch-release-oci-comparison
          path: comparison/
          retention-days: 90
          if-no-files-found: error
      - name: Enforce comparison result
        if: steps.compare.outcome != 'success'
        run: exit 1
