name: Build McRemote candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mc-remote-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ./.github/actions/install-dependencies
      - name: Verify tooling consumer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --test scripts/acquire-mcremote-tooling.test.mjs scripts/build-mcremote-candidate-manifest.test.mjs
          npm run tooling:artifacts
      - name: Verify Bridge OCI digest preservation
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          EXPECTED="$(jq -r .artifacts.bridge_digest mc-remote/tooling-lock.json)"
          skopeo copy --all --preserve-digests --digestfile bridge-digest.txt \
            oci-archive:mc-remote/tooling/artifacts/bridge.oci.tar \
            "oci:$RUNNER_TEMP/bridge-check:bridge"
          test "$(cat bridge-digest.txt)" = "$EXPECTED"
      - run: npm run build
      - name: Collect candidate files
        run: |
          test -f packages/scratch-gui/build/index.html
          mkdir -p candidate
          tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
            --mode='a+rX,u+w,go-w' \
            -cf - -C packages/scratch-gui build | gzip -n > candidate/scratch-gui.tar.gz
          tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
            --mode='a+rX,u+w,go-w' \
            -cf - -C packages/scratch-gui contracts | gzip -n > candidate/contracts.tar.gz
          cp mc-remote/tooling/artifacts/wirescope-app.zip candidate/
          cp mc-remote/tooling/artifacts/wirescope-app.manifest.json candidate/
          cp mc-remote/tooling/artifacts/bridge.oci.tar candidate/
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Scratch OCI archive
        id: scratch
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: packages/scratch-gui
          file: packages/scratch-gui/Dockerfile.mc-remote
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=candidate/scratch.oci.tar
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            RELEASE_VERSION=2320.0.0b9
      - name: Record candidate identity
        run: node scripts/build-mcremote-candidate-manifest.mjs "${{ github.sha }}" "${{ steps.scratch.outputs.digest }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scratch-candidate-${{ github.sha }}
          path: candidate/
          retention-days: 90
          if-no-files-found: error
